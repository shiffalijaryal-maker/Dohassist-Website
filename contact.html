<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Sales | DohAssist</title>
    <!-- Relative paths for local testing -->
    <link rel="stylesheet" href="./styles/main.css">
    <script src="./components/layout.js" defer></script>
</head>

<body style="background: var(--bg-color);">
    <doh-header></doh-header>

    <main>
        <section class="hero container"
            style="min-height: 100vh; padding-top: 150px; display: flex; align-items: flex-start; justify-content: center;">
            <div class="glass-card"
                style="width: 100%; max-width: 650px; text-align: center; border-color: rgba(0, 122, 255, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.05), inset 0 0 20px rgba(0, 122, 255, 0.05);">

                <h1
                    style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800; background: var(--gradient-blue-green); -webkit-background-clip: text; background-clip: text; color: transparent;">
                    Let's Build Your OS</h1>
                <p style="color: var(--text-muted); margin-bottom: 2.5rem;">Fill out the form below to get your custom
                    ROI analysis and see how DohAssist can transform your operations.</p>

                <form action="#" method="POST" id="leadCaptureForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label class="form-label">First Name *</label>
                            <input type="text" class="form-control" name="firstName" required placeholder="John">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name *</label>
                            <input type="text" class="form-control" name="lastName" required placeholder="Doe">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Work Email *</label>
                        <input type="email" class="form-control" name="email" required placeholder="john@company.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" name="phone" placeholder="(555) 555-5555">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Company Name *</label>
                        <input type="text" class="form-control" name="company" required placeholder="Acme Corp">
                    </div>

                    <div class="form-group">
                        <label class="form-label">What are you most interested in? *</label>
                        <select class="form-control" name="interest" required
                            style="cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=%22%231a1a24%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M7 10l5 5 5-5z%22/></svg>'); background-repeat: no-repeat; background-position-x: 98%; background-position-y: 50%;">
                            <option value="">Select a solution...</option>
                            <option value="DohShield">Protect: DohShield (Loss Prevention)</option>
                            <option value="DohOps">Manage: DohOps (Workforce Management)</option>
                            <option value="DohReconcile">Execute: DohReconcile (Daily Audit)</option>
                            <option value="DohEstimate">Execute: DohEstimate (Estimating)</option>
                            <option value="DohCollect">Execute: DohCollect (A/R Collections)</option>
                            <option value="DohVerify">Execute: DohVerify (Insurance Verification)</option>
                            <option value="Other">Other / Not Sure</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Additional Details (Optional)</label>
                        <textarea class="form-control" name="details"
                            placeholder="Tell us a little bit about your current operations and pain points..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary neon-glow"
                        style="width: 100%; border: none; font-size: 1.1rem; padding: 1.2rem; margin-top: 1rem; cursor: pointer;">Request
                        ROI Analysis</button>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1.5rem;">By submitting this form,
                        you agree to our Terms of Service. We respect your privacy and will never sell your data.</p>
                </form>
            </div>
        </section>
    </main>

    <doh-footer></doh-footer>
</body>

</html>
